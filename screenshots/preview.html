<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<title>BcnMap Screenshots v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Mono:ital,wght@0,400;0,500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #070707; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .live-dot { animation: blink 2s ease-in-out infinite; }
  input[type=range] { -webkit-appearance:none; appearance:none; height:2px; border-radius:99px; outline:none; cursor:pointer; background: #333; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#E8622A; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ── TOKENS ─────────────────────────────────── */
const BG     = '#0A0A0A';
const CARD   = '#141414';
const CARD2  = '#1C1C1C';
const LINE   = '#262626';
const LINE2  = '#1C1C1C';
const ORANGE = '#E8622A';   /* Bicing — warm, specific */
const BLUE   = '#4D84D4';   /* architectural */
const GREEN  = '#3CB887';   /* positive */
const AMBER  = '#C98E2E';   /* warning */
const RED    = '#D45555';   /* incident */
const PURPLE = '#8B6AD4';   /* metro */

const T = {
  hi:    '#EBEBEB',
  mid:   '#888888',
  lo:    '#555555',
  faint: '#333333',
};

const SYNE = { fontFamily:"'Syne',sans-serif" };
const MONO = { fontFamily:"'Instrument Mono',monospace" };

/* ── ATOMS ───────────────────────────────────── */
function LiveDot({ color=GREEN }) {
  return <span className="live-dot" style={{display:'inline-block',width:5,height:5,borderRadius:'50%',background:color,flexShrink:0}} />;
}

function Label({ children, style }) {
  return <span style={{...SYNE,fontSize:9,fontWeight:600,letterSpacing:'0.16em',textTransform:'uppercase',color:T.lo,...style}}>{children}</span>;
}

function Num({ children, size=28, color=T.hi }) {
  return <span style={{...MONO,fontSize:size,fontWeight:400,color,lineHeight:1,letterSpacing:'-0.02em'}}>{children}</span>;
}

function Chip({ label, color }) {
  return <span style={{...SYNE,fontSize:9,fontWeight:600,padding:'2px 7px',borderRadius:3,color,background:`${color}18`,border:`1px solid ${color}28`,letterSpacing:'0.06em',textTransform:'uppercase'}}>{label}</span>;
}

function Bar({ pct, color, h=3 }) {
  return (
    <div style={{background:LINE,borderRadius:99,height:h,overflow:'hidden'}}>
      <div style={{width:`${pct}%`,height:'100%',background:color,borderRadius:99}} />
    </div>
  );
}

function Card({ children, accent, style }) {
  return (
    <div style={{background:CARD,border:`1px solid ${LINE}`,borderRadius:8,overflow:'hidden',color:T.hi,display:'flex',...style}}>
      {accent && <div style={{width:3,background:accent,flexShrink:0}} />}
      <div style={{flex:1,overflow:'hidden'}}>{children}</div>
    </div>
  );
}

function Divider() {
  return <div style={{height:'0.5px',background:LINE2,margin:'0 16px'}} />;
}

function MetaRow({ label, value, color }) {
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0'}}>
      <span style={{...SYNE,fontSize:11,color:T.mid}}>{label}</span>
      <span style={{...MONO,fontSize:11,color:color||T.hi}}>{value}</span>
    </div>
  );
}

function PrimaryBtn({ children, onClick }) {
  return <button onClick={onClick} style={{...SYNE,flex:1,padding:'10px 0',borderRadius:6,border:'none',background:T.hi,color:'#0A0A0A',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em'}}>{children}</button>;
}
function GhostBtn({ children }) {
  return <button style={{...SYNE,padding:'10px 14px',borderRadius:6,fontSize:12,fontWeight:500,cursor:'pointer',background:'transparent',border:`1px solid ${LINE}`,color:T.mid}}>{children}</button>;
}
function ActionRow({ primary, secondary }) {
  return (
    <div style={{padding:'10px 12px',display:'flex',gap:8,borderTop:`0.5px solid ${LINE2}`}}>
      <PrimaryBtn>{primary}</PrimaryBtn>
      {secondary&&<GhostBtn>{secondary}</GhostBtn>}
    </div>
  );
}

/* ── ICONS ───────────────────────────────────── */
const Ic = {
  bike:  (c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.5} strokeLinecap="round"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17L10 8L14 8L18 17M10 8L13 17M13 6L16 6"/></svg>,
  metro: (c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.5} strokeLinecap="round"><rect x="6" y="3" width="12" height="13" rx="3"/><line x1="6" y1="11" x2="18" y2="11"/><circle cx="9" cy="14" r=".8" fill={c} stroke="none"/><circle cx="15" cy="14" r=".8" fill={c} stroke="none"/><path d="M8 16L6 21M16 16L18 21"/></svg>,
  alert: (c,s=16)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.8} strokeLinecap="round"><path d="M12 2L2 21h20L12 2z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17.5" r=".6" fill={c} stroke="none"/></svg>,
  walk:  (c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.5} strokeLinecap="round"><circle cx="13" cy="4" r="1.6"/><path d="M13 7L11 12 9 18"/><path d="M13 7l3 3 3 2"/><path d="M11 12l3 2v4"/><path d="M9 18l-1 4M14 18l-1 4"/></svg>,
  pin:   (c,s=14)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.5} strokeLinecap="round"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>,
  clock: (c,s=13)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.5} strokeLinecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>,
  phone: (c,s=13)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.5} strokeLinecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L7.9 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6A2 2 0 0 1 22 16.9z"/></svg>,
  tag:   (c,s=13)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={1.5} strokeLinecap="round"><path d="M20.6 11.4L12.6 3.4A2 2 0 0 0 11.2 3H5a2 2 0 0 0-2 2v6.2a2 2 0 0 0 .6 1.4l8 8a2 2 0 0 0 2.8 0l6.2-6.2a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1" fill={c} stroke="none"/></svg>,
  chat:  (c,s=16)=><svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 1.5C4.41 1.5 1.5 4.02 1.5 7.12c0 1.64.73 3.11 1.9 4.14L3 14.5l3.88-1.94c.35.07.72.1 1.12.1 3.59 0 6.5-2.52 6.5-5.54S11.59 1.5 8 1.5Z" stroke={c} strokeWidth="1.3" strokeLinejoin="round"/><circle cx="5.5" cy="7.5" r=".8" fill={c}/><circle cx="8" cy="7.5" r=".8" fill={c}/><circle cx="10.5" cy="7.5" r=".8" fill={c}/></svg>,
  play:  (c,s=11)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M5 3l14 9-14 9V3z"/></svg>,
  pause: (c,s=11)=><svg width={s} height={s} viewBox="0 0 24 24" fill={c}><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>,
  star:  (c,s=10)=><svg width={s} height={s} viewBox="0 0 12 12" fill={c}><path d="M6 1l1.4 2.8 3.1.45-2.25 2.2.53 3.1L6 8.1 3.22 9.55l.53-3.1L1.5 4.25l3.1-.45z"/></svg>,
};

/* ═══════════════════════════════════════════════
   S1 — CITY HUD
═══════════════════════════════════════════════ */
function HudA() {
  return (
    <Card style={{width:258,flexDirection:'column'}}>
      <div style={{padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`0.5px solid ${LINE2}`}}>
        <div style={{display:'flex',alignItems:'center',gap:7}}>
          <LiveDot color={ORANGE} />
          <Label>BCN · Live</Label>
        </div>
        <span style={{...MONO,fontSize:10,color:T.lo}}>14:32</span>
      </div>
      <div style={{padding:'14px',display:'flex',alignItems:'flex-end',justifyContent:'space-between',borderBottom:`0.5px solid ${LINE2}`}}>
        <div style={{display:'flex',alignItems:'baseline',gap:3}}>
          <Num size={42}>22</Num>
          <span style={{...SYNE,fontSize:20,color:T.lo,fontWeight:400}}>°C</span>
        </div>
        <div style={{textAlign:'right'}}>
          <p style={{...SYNE,fontSize:12,color:T.mid,marginBottom:3}}>Parcialment ennuvolat</p>
          <p style={{...MONO,fontSize:10,color:T.lo}}>12 km/h vent</p>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr'}}>
        {[{l:'AQI',v:'42',c:GREEN},{l:'Trànsit',v:'23%',c:GREEN},{l:'Bicis',v:'1.2k',c:ORANGE}].map(({l,v,c},i)=>(
          <div key={l} style={{padding:'12px 0',textAlign:'center',borderRight:i<2?`0.5px solid ${LINE2}`:'none'}}>
            <Label style={{display:'block',marginBottom:6}}>{l}</Label>
            <span style={{...MONO,fontSize:15,color:c}}>{v}</span>
          </div>
        ))}
      </div>
    </Card>
  );
}

function HudB() {
  return (
    <Card style={{width:290,flexDirection:'column'}}>
      <div style={{padding:'10px 14px',borderBottom:`0.5px solid ${LINE2}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:7}}>
          <LiveDot color={ORANGE} />
          <Label>Barcelona · Temps real</Label>
        </div>
        <span style={{...MONO,fontSize:10,color:T.lo}}>20 mai · 14:32</span>
      </div>
      <div style={{padding:'14px',display:'flex',alignItems:'center',gap:16,borderBottom:`0.5px solid ${LINE2}`}}>
        <div style={{display:'flex',alignItems:'baseline',gap:3}}>
          <Num size={46}>22</Num>
          <span style={{...SYNE,fontSize:22,color:T.lo}}>°C</span>
        </div>
        <div style={{flex:1}}>
          <p style={{...SYNE,fontSize:12,color:T.mid,marginBottom:5}}>Parcialment ennuvolat</p>
          <div style={{display:'flex',gap:10}}>
            <span style={{...MONO,fontSize:10,color:T.lo}}>↑27° ↓17°</span>
            <span style={{...MONO,fontSize:10,color:T.lo}}>12 km/h</span>
          </div>
        </div>
      </div>
      {[
        {l:"Qualitat de l'aire",v:'Bona',metric:'42 AQI',pct:30,c:GREEN},
        {l:'Congestió trànsit',v:'Fluït',metric:'23%',pct:23,c:GREEN},
        {l:'Bicing disponible',v:'1.247 bicis',metric:'68%',pct:68,c:ORANGE},
      ].map(({l,v,metric,pct,c},i,arr)=>(
        <div key={l} style={{padding:'10px 14px',borderBottom:i<arr.length-1?`0.5px solid ${LINE2}`:'none'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:7,alignItems:'baseline'}}>
            <span style={{...SYNE,fontSize:11,color:T.mid}}>{l}</span>
            <div style={{display:'flex',gap:8,alignItems:'baseline'}}>
              <span style={{...SYNE,fontSize:11,color:c,fontWeight:500}}>{v}</span>
              <span style={{...MONO,fontSize:10,color:T.lo}}>{metric}</span>
            </div>
          </div>
          <Bar pct={pct} color={c} h={2} />
        </div>
      ))}
    </Card>
  );
}

function HudC() {
  /* Ultra-minimal floating */
  return (
    <div style={{display:'flex',flexDirection:'column',gap:8,width:220}}>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'7px 12px',borderRadius:99,background:CARD,border:`1px solid ${LINE}`,alignSelf:'flex-start'}}>
        <LiveDot color={ORANGE} />
        <span style={{...SYNE,fontSize:22,fontWeight:400,color:T.hi}}>22°</span>
        <span style={{...SYNE,fontSize:11,color:T.mid}}>Ennuvolat</span>
      </div>
      <div style={{display:'flex',gap:6}}>
        {[{l:'AQI',v:'42',c:GREEN},{l:'Trànsit',v:'23%',c:GREEN},{l:'Bicis',v:'1.2k',c:ORANGE}].map(({l,v,c})=>(
          <div key={l} style={{padding:'7px 11px',borderRadius:6,background:CARD,border:`1px solid ${l==='Bicis'?`${ORANGE}30`:LINE}`}}>
            <Label style={{display:'block',marginBottom:4}}>{l}</Label>
            <span style={{...MONO,fontSize:14,color:c}}>{v}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   S2 — TRANSPORT CARDS
═══════════════════════════════════════════════ */
function BicingCard() {
  return (
    <Card accent={ORANGE} style={{width:282,flexDirection:'column'}}>
      <div style={{padding:'14px'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10,marginBottom:14}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <Label style={{color:ORANGE}}>Bicing #042</Label>
              <Chip label="Activa" color={GREEN} />
            </div>
            <h3 style={{...SYNE,fontSize:15,fontWeight:600,color:T.hi,lineHeight:1.2,marginBottom:4}}>C/ Aragó – Pg. de Gràcia</h3>
            <span style={{...SYNE,fontSize:11,color:T.mid}}>Eixample · 180m de tu</span>
          </div>
          <div style={{width:36,height:36,borderRadius:6,background:CARD2,border:`1px solid ${LINE}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            {Ic.bike(ORANGE, 18)}
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:14}}>
          {[
            {l:'Bicis mec.',v:8,c:BLUE},
            {l:'Elèctriques',v:5,c:ORANGE},
            {l:'Ancoratges',v:9,c:T.mid},
          ].map(({l,v,c})=>(
            <div key={l} style={{background:CARD2,border:`1px solid ${LINE}`,borderRadius:6,padding:'10px 8px',textAlign:'center'}}>
              <span style={{...MONO,fontSize:24,color:c,display:'block',lineHeight:1,marginBottom:5}}>{v}</span>
              <Label>{l}</Label>
            </div>
          ))}
        </div>
        <div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <Label>Capacitat</Label>
            <span style={{...MONO,fontSize:10,color:T.mid}}>23 / 32</span>
          </div>
          <Bar pct={72} color={ORANGE} h={2} />
        </div>
      </div>
      <ActionRow primary="Com arribar-hi" secondary="Navegar" />
    </Card>
  );
}

function MetroCard() {
  return (
    <Card accent={PURPLE} style={{width:282,flexDirection:'column'}}>
      <div style={{padding:'14px'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10,marginBottom:14}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
              {[{t:'L2',bg:'#8c4799',tc:'#fff'},{t:'L4',bg:'#f8c300',tc:'#000'}].map(({t,bg,tc})=>(
                <span key={t} style={{...MONO,fontSize:11,fontWeight:500,padding:'2px 7px',borderRadius:3,background:bg,color:tc}}>{t}</span>
              ))}
              <Chip label="Operatiu" color={GREEN} />
            </div>
            <h3 style={{...SYNE,fontSize:16,fontWeight:600,color:T.hi,marginBottom:4}}>Passeig de Gràcia</h3>
            <span style={{...SYNE,fontSize:11,color:T.mid}}>Eixample · 340m</span>
          </div>
          <div style={{width:36,height:36,borderRadius:6,background:CARD2,border:`1px solid ${LINE}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            {Ic.metro(PURPLE, 18)}
          </div>
        </div>
        <Label style={{display:'block',marginBottom:10}}>Pròxims trens</Label>
        <div style={{display:'flex',flexDirection:'column',gap:0}}>
          {[
            {ln:'L2',dir:'Badalona Pompeu Fabra',min:2,bg:'#8c4799',tc:'#fff'},
            {ln:'L4',dir:'La Pau',min:4,bg:'#f8c300',tc:'#000'},
            {ln:'L2',dir:'Paral·lel',min:7,bg:'#8c4799',tc:'#fff'},
          ].map(({ln,dir,min,bg,tc},i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:i<2?`0.5px solid ${LINE2}`:'none'}}>
              <span style={{...MONO,fontSize:10,fontWeight:500,padding:'1px 5px',borderRadius:2,background:bg,color:tc,minWidth:22,textAlign:'center'}}>{ln}</span>
              <span style={{...SYNE,fontSize:12,color:T.mid,flex:1}}>{dir}</span>
              <span style={{...MONO,fontSize:13,color:min<=3?ORANGE:T.hi,fontWeight:400}}>{min} min</span>
            </div>
          ))}
        </div>
      </div>
      <ActionRow primary="Com arribar-hi" secondary="Horaris" />
    </Card>
  );
}

function TrafficCard() {
  return (
    <Card accent={RED} style={{width:282,flexDirection:'column'}}>
      <div style={{padding:'12px 14px',background:`${RED}0A`,borderBottom:`0.5px solid ${RED}20`,display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:30,height:30,borderRadius:4,background:`${RED}15`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          {Ic.alert(RED,15)}
        </div>
        <div>
          <Label style={{color:RED,display:'block',marginBottom:3}}>Incident de trànsit</Label>
          <h3 style={{...SYNE,fontSize:14,fontWeight:600,color:T.hi}}>Tall de carril — Gran Via</h3>
        </div>
      </div>
      <div style={{padding:'14px',borderBottom:`0.5px solid ${LINE2}`}}>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <MetaRow label="Tram afectat" value="Balmes → Enric Granados" />
          <MetaRow label="Velocitat actual" value="12 km/h" color={AMBER} />
          <MetaRow label="Retard estimat" value="+14 min" color={RED} />
          <MetaRow label="Reportat" value="fa 8 min" />
        </div>
      </div>
      <div style={{padding:'12px 14px',borderBottom:`0.5px solid ${LINE2}`}}>
        <div style={{display:'flex',gap:2,marginBottom:6}}>
          {['fluït','fluït','lent','lent','cong.','tallat','lent','fluït'].map((s,i)=>{
            const c=s==='fluït'?GREEN:s==='lent'?AMBER:s==='cong.'?ORANGE:RED;
            return <div key={i} style={{flex:1,height:20,borderRadius:2,background:`${c}28`,borderTop:`2px solid ${c}`}} />;
          })}
        </div>
        <Label>Estat del tram per segments</Label>
      </div>
      <div style={{padding:'10px 12px'}}>
        <button style={{...SYNE,width:'100%',padding:'9px 0',borderRadius:6,border:`1px solid ${LINE}`,background:'transparent',color:T.mid,fontSize:12,fontWeight:500,cursor:'pointer'}}>
          Veure ruta alternativa →
        </button>
      </div>
    </Card>
  );
}

function AirCard() {
  return (
    <Card accent={GREEN} style={{width:264,flexDirection:'column'}}>
      <div style={{padding:'14px',borderBottom:`0.5px solid ${LINE2}`}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <Label>Qualitat de l'Aire</Label>
          <Chip label="Bona" color={GREEN} />
        </div>
        <div style={{display:'flex',alignItems:'flex-end',gap:12}}>
          <div style={{display:'flex',alignItems:'baseline',gap:4}}>
            <Num size={54} color={GREEN}>42</Num>
            <span style={{...MONO,fontSize:14,color:`${GREEN}90`}}>AQI</span>
          </div>
          <p style={{...SYNE,fontSize:11,color:T.mid,lineHeight:1.55,paddingBottom:4,flex:1}}>Adequat per activitat física exterior.</p>
        </div>
      </div>
      <div style={{padding:'14px'}}>
        <Label style={{display:'block',marginBottom:12}}>Contaminants</Label>
        {[
          {n:'PM2.5',v:8.2, max:25, c:GREEN},
          {n:'PM10', v:18.4,max:50, c:GREEN},
          {n:'NO₂',  v:32.1,max:40, c:AMBER},
          {n:'O₃',   v:68.5,max:100,c:GREEN},
        ].map(({n,v,max,c})=>(
          <div key={n} style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
              <span style={{...MONO,fontSize:11,color:T.mid}}>{n}</span>

        <DCArtboard id="n4" label="Bicing disponible" width={320} height={100}>
          <ToastBicing />
        </DCArtboard>
      </DCSection>

      <DCSection id="place" title="Drawer — Vista de Lloc i Llista Propera">
        <DCArtboard id="place-view" label="PlaceView redissenyat" width={300} height={460}>
          <PlaceViewCard />
        </DCArtboard>
        <DCArtboard id="nearby" label="Nearby — llocs propers" width={300} height={310}>
          <NearbyList />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)

function Section({ title, children }) {
  return (
    <div style={{marginBottom:64}}>
      <p style={{fontFamily:"'Syne',sans-serif",fontSize:10,color:'#444',textTransform:'uppercase',letterSpacing:'0.18em',marginBottom:24,paddingBottom:12,borderBottom:'1px solid #1C1C1C'}}>
        {title}
      </p>
      <div style={{display:'flex',flexWrap:'wrap',gap:24,alignItems:'flex-start'}}>
        {children}
      </div>
    </div>
  );
}

function Card2({ label, children }) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
      {children}
      <p style={{fontFamily:"'Instrument Mono',monospace",fontSize:9,color:'#444',textTransform:'uppercase',letterSpacing:'0.12em',textAlign:'center'}}>{label}</p>
    </div>
  );
}

function App() {
  return (
    <div style={{padding:'52px 52px 80px',background:'#070707',minHeight:'100vh'}}>
      <Section title="City HUD — Widget de dades en temps real">
        <Card2 label="A · Compacte"><HudA /></Card2>
        <Card2 label="B · Expandit"><HudB /></Card2>
        <Card2 label="C · Pills flotants"><HudC /></Card2>
      </Section>
      <Section title="Cards de Transport">
        <Card2 label="Estació Bicing"><BicingCard /></Card2>
        <Card2 label="Estació Metro"><MetroCard /></Card2>
        <Card2 label="Incident de Trànsit"><TrafficCard /></Card2>
        <Card2 label="Qualitat de l'Aire"><AirCard /></Card2>
      </Section>
      <Section title="Experiència de Ruta">
        <Card2 label="Capçalera ruta activa"><RouteHeader /></Card2>
        <Card2 label="Instruccions pas a pas"><RouteSteps /></Card2>
        <Card2 label="Ruta multimodal IA (v2)"><MultimodalRoute /></Card2>
      </Section>
      <Section title="Control Temporal — Historial (Fase 7)">
        <Card2 label="Slider compacte"><TimeSliderA /></Card2>
        <Card2 label="Slider amb sparkline i playback"><TimeSliderB /></Card2>
      </Section>
      <Section title="Notificacions en Temps Real">
        <Card2 label="Actualització de dades"><ToastUpdate /></Card2>
        <Card2 label="Alerta de trànsit"><ToastTraffic /></Card2>
        <Card2 label="Resposta IA"><ToastAI /></Card2>
        <Card2 label="Bicing disponible"><ToastBicing /></Card2>
      </Section>
      <Section title="Drawer — Vista de Lloc i Llista Propera">
        <Card2 label="PlaceView amb tabs"><PlaceViewCard /></Card2>
        <Card2 label="Nearby — llocs propers"><NearbyList /></Card2>
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
